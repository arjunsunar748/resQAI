# ==============================================================================
# RESQ AGENT - Multi-Container Development & Deployment Environment
# ==============================================================================
services:
  # 1. Spatial Relational Database with PostGIS
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: resq-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resq_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-resq_ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resq-network

  # 2. Redis In-Memory Cache, Rate Limiting & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: resq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - resq-network

  # 3. Local Offline AI Engine (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: resq-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    networks:
      - resq-network

  # 4. Backend Command Center API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resq-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@postgis:5432/${POSTGRES_DB:-resq_ai_db}
      REDIS_URL: redis://redis:6379/0
      AI_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - resq-network

  # 5. Frontend Command Center (React + Vite + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    container_name: resq-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - resq-network

networks:
  resq-network:
    driver: bridge

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  ollamadata:
    driver: local
